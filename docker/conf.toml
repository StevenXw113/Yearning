# 镜像内兜底配置：环境变量优先（SECRET_KEY / RPC_ADDR / RPC_TOKEN / MYSQL_* / Y_LANG）
# 需改动时挂载覆盖：- ./conf.toml:/opt/conf.toml:ro

[Mysql]
Db = "Yearning_go"
Host = "127.0.0.1"
Port = "3306"
User = "root"
Password = ""

[General]
# 占位值会被代码拒绝启动，必须用环境变量 SECRET_KEY 注入
SecretKey = "CHANGE_ME_PLEASE_USE_RANDOM_32_CHARS"
# 引擎独立部署：compose 内由 RPC_ADDR 环境变量覆盖
RpcAddr = "yearning-engine:13307"
# 引擎共享令牌：与引擎侧 ENGINE_AUTH_TOKEN 一致；留空 = 不认证
RpcToken = ""
LogLevel = "info"
Lang = "zh_CN" # en_US / zh_CN

[Oidc]
Enable = false
