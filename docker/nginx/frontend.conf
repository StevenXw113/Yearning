# 前端容器 Nginx：/ 与 /front/ 提供静态产物，其余路径同源反代 yearning:8000
# 后端换 IP 后需 `docker compose restart frontend`（upstream 启动时解析）

# WebSocket（查询页通过 Sec-WebSocket-Protocol 传令牌）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream yearning_backend {
    server yearning:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;

    # 首页：必须用 try_files 命中文件，用 index 回退会被下面的 location / 反代到后端
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location = /front {
        return 302 /;
    }

    location = /icon.png {
        root /usr/share/nginx/html;
    }

    # 静态资源（vite base=/front/，hash 路由无需 history fallback）
    location /front/ {
        alias /usr/share/nginx/html/;
        index index.html;
    }

    # AI 助手 SSE：关闭缓冲，否则前端收不到增量输出
    location = /api/v2/chat {
        proxy_pass http://yearning_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 其余全给后端：/api/v2/*、/login、/oidc/*、/chatbot、/_next/*、/downlaod/*
    location / {
        proxy_pass http://yearning_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }
}
