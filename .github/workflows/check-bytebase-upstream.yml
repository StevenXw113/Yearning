name: check-bytebase-upstream

# 只检测、不修改代码：上游有新 release 时开/更新一个 issue 提醒。
# 早先是让 job 失败来提醒，但红 job 容易被无视；issue 能留存、能指派、能挂升级流程。
# 更新仍由人工触发（engine/scripts/sync-bytebase.sh <ref>），CI 绝不改代码。
on:
  schedule:
    # 每天 02:00 UTC（北京时间 10:00）
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # check-upstream.sh 退出码：0=已是最新，10=有新版本，其他=查询失败。
      - name: 检查 Bytebase 是否有新 release
        id: upstream
        run: |
          cd engine
          set +e
          ./scripts/check-upstream.sh > /tmp/upstream.log 2>&1
          code=$?
          set -e
          cat /tmp/upstream.log
          {
            echo "code=$code"
            echo "current=$(awk '/^ref:/{print $2}' internal/bytebase/UPSTREAM)"
            echo "latest=$(./scripts/check-upstream.sh --latest)"
          } >> "$GITHUB_OUTPUT"
          # 查询失败（非 0/10）才让 job 红：那说明脚本或网络有问题，需要人看
          if [ "$code" != "0" ] && [ "$code" != "10" ]; then
            echo "::error::check-upstream.sh 异常退出（code=$code）"
            exit 1
          fi

      - name: 有新版本则开/更新 issue
        if: steps.upstream.outputs.code == '10'
        uses: actions/github-script@v4
        with:
          script: |
            const current = '${{ steps.upstream.outputs.current }}';
            const latest = '${{ steps.upstream.outputs.latest }}';
            const marker = '[Upgrade] Bytebase';
            const body = [
              `检测到上游新的 Bytebase release：**${current} → ${latest}**`,
              '',
              '升级流程见 `engine/README.md`「上游规则更新」与「Docker 升级与回滚」：',
              '',
              `1. \`cd engine && ./scripts/sync-bytebase.sh ${latest}\`（同步 → 裁剪 → 构建校验，失败自动回滚）`,
              '2. 审阅 `git diff`：`engine/RULES.md` 会列出规则增删，新增规则会被 archguard 测试点名',
              '3. 行为 diff：`go run ./tools/checkdiff -old <线上引擎> -new <候选引擎> -meta-dsn ...`',
              '4. 通过后同端口替换容器，保留旧镜像 tag 以便回滚',
            ].join('\n');
            const { owner, repo } = context.repo;
            const open = await github.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 });
            const exist = open.data.find(i => i.title.startsWith(marker));
            if (exist) {
              await github.issues.createComment({
                owner, repo, issue_number: exist.number,
                body: `上游仍有新版本：${current} → ${latest}`,
              });
              core.info(`已有 issue #${exist.number}，追加评论`);
            } else {
              const created = await github.issues.create({
                owner, repo,
                title: `${marker} ${latest} 可用（当前 ${current}）`,
                body,
              });
              core.info(`已创建 issue #${created.data.number}`);
            }
