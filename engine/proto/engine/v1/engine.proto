syntax = "proto3";

package engine.v1;

option go_package = "engine/gen/engine/v1;enginev1";

// EngineService 提供与 Juno 一致的审核/执行能力：SQL 走 MySQL 方言规则，
// MongoDB 命令走本仓库自研的 Mongo 规则（上游 bytebase 无 Mongo 规则）。
service EngineService {
  // Check 执行 SQL 静态审核，返回逐条语句的审核结果。
  rpc Check(CheckRequest) returns (CheckReply);
  // MergeAlterTables 合并多条 ALTER TABLE 语句。
  rpc MergeAlterTables(MergeAlterTablesRequest) returns (MergeAlterTablesReply);
  // Exec 执行已审批工单中的 SQL（DDL/DML）。
  rpc Exec(ExecRequest) returns (ExecReply);
  // Query 执行查询并返回结果集（经敏感字段收敛）。
  rpc Query(QueryRequest) returns (QueryReply);
  // StopDelay 停止/调度延迟工单立即执行。
  rpc StopDelay(StopDelayRequest) returns (StopDelayReply);
}

// 数据源连接信息。密码仅用于建立到目标库的连接，绝不落日志。
message DataSource {
  string ip = 1;
  int32 port = 2;
  string username = 3;
  string password = 4;
  string ca = 5;
  string cert = 6;
  string key = 7;
  string kind = 8; // "mysql" 或 "mongodb"
}

// 审核规则，与 Yearning engine.AuditRole 对齐。
message AuditRole {
  bool dml_transaction = 1;
  bool dml_allow_limit_stmt = 2;
  bool dml_insert_columns = 3;
  int32 dml_max_insert_rows = 4;
  bool dml_where = 5;
  bool dml_where_expr_value_is_null = 6;
  bool dml_order = 7;
  bool dml_select = 8;
  bool dml_allow_insert_null = 9;
  bool dml_insert_must_explicitly = 10;
  bool ddl_enable_primary_key = 11;
  bool ddl_check_table_comment = 12;
  bool ddl_check_column_comment = 13;
  bool ddl_check_column_nullable = 14;
  bool ddl_check_column_default = 15;
  bool ddl_enable_across_db_rename = 16;
  bool ddl_enable_autoincrement_init = 17;
  bool ddl_enable_auto_increment = 18;
  bool ddl_enable_autoincrement_unsigned = 19;
  bool ddl_enable_drop_table = 20;
  bool ddl_enable_drop_database = 21;
  bool ddl_enable_null_index_name = 22;
  bool ddl_index_name_spec = 23;
  uint32 ddl_max_key_parts = 24;
  uint32 ddl_max_key = 25;
  uint32 ddl_max_char_length = 26;
  int32 max_table_name_len = 27;
  uint32 max_affect_rows = 28;
  uint32 max_ddl_affect_rows = 29;
  string support_charset = 30;
  string support_collation = 31;
  bool check_identifier = 32;
  string must_have_columns = 33;
  bool ddl_multi_to_commit = 34;
  bool ddl_primary_key_must = 35;
  bool ddl_allow_column_type = 36;
  bool ddl_implicit_type_conversion = 37;
  bool ddl_allow_pri_not_int = 38;
  bool ddl_allow_multi_alter = 39;
  bool ddl_enable_foreign_key = 40;
  string ddl_table_prefix = 41;
  string ddl_columns_must_have_index = 42;
  bool ddl_allow_change_column_position = 43;
  bool ddl_check_float_double = 44;
  bool is_osc = 45;
  string osc_expr = 46;
  uint32 osc_size = 47;
  bool allow_create_view = 48;
  bool allow_create_view_with_select_star = 49;
  bool allow_create_partition = 50;
  bool allow_special_type = 51;
  bool pri_roll_back = 52;
  // 规则级别：key 为规则集里的字段名（与前端规则开关同名），value 取 error/warn/observe。
  // 缺省 error（命中即拦截）；warn 提示不拦、observe 只记录不拦，用于新规则灰度上线。
  map<string, string> rule_levels = 53;
  // 自研规则开关（internal/customrules）：true = 禁止 TRUNCATE。
  bool ddl_forbid_truncate = 54;

  // ------- MongoDB 审核规则（internal/mongocheck，自研）-------
  // 上游 bytebase 不提供 Mongo 审核规则（common.EngineSupportSQLReview(MONGODB) 为 false，
  // advisor 目录里也没有 mongodb 方言），这几项由本仓库自研；
  // true = 启用该限制，级别同样走 rule_levels（key 为下面的字段名）。
  // 语义与 SQL 侧一致：开关可关，级别可调（error 拦截 / warn 提示 / observe 观察）。
  bool mongo_forbid_empty_filter = 55;
  bool mongo_forbid_dangerous = 56;
  bool mongo_forbid_where = 57;
  bool mongo_forbid_drop_collection = 58;
  // 单次 update / delete 允许命中的文档数上限，0 = 不限制。
  // 注意：这是**执行期**限制（静态审核拿不到命中数），引擎侧只透传配置，
  // 真正的判定在主程序抓取前镜像时进行。
  int32 mongo_max_affect_rows = 59;
  // 禁止变更 system.* 集合（system.users / system.profile / system.js / system.views）
  bool mongo_forbid_system_collection = 60;
  // 禁止账号与权限管理命令（createUser / dropUser / grantRolesToUser / createRole 等）
  bool mongo_forbid_admin_command = 61;
  // 禁止修改 _id（不可变字段：$set / $unset / $rename / 替换文档）
  bool mongo_forbid_immutable_id = 62;

  // ------- MongoDB 结构类规则（默认 warn，避免误报影响提交）-------
  // convertToCapped 会重建集合（不可逆），默认拦截
  bool mongo_forbid_capped_convert = 63;
  bool mongo_forbid_coll_mod = 64;
  // 单索引键数上限，0 = 不限制（Mongo 自身上限 32）
  int32 mongo_index_key_limit = 65;
  // 索引命名规范（正则，空 = 规则不生效）
  string mongo_index_name_spec = 66;
  // 集合名前缀规范（空 = 规则不生效）
  string mongo_collection_prefix = 67;
  // 集合名长度上限，0 = 不限制
  int32 mongo_max_collection_name_len = 68;

  // ------- MongoDB 性能类规则（默认 warn，只提示不拦）-------
  // 以下 4 条同时适用于变更与查询两种模式
  bool mongo_regex_unanchored = 69;
  bool mongo_negation_operator = 70;
  bool mongo_or_clause = 71;
  // $in 元素个数上限，0 = 不限制
  int32 mongo_large_in_list = 72;
  // 以下 3 条只适用于查询模式
  bool mongo_query_forbid_no_filter = 73;
  bool mongo_query_forbid_lookup = 74;
  bool mongo_query_forbid_no_limit = 75;
}


// 工单（用于 Exec），字段与 Yearning CoreSqlOrder 对齐。
message Order {
  string work_id = 1;
  string username = 2;
  uint32 status = 3;
  int32 type = 4; // 1 dml, 0 ddl
  uint32 backup = 5;
  string idc = 6;
  string source = 7;
  string source_id = 8;
  string data_base = 9;
  string table = 10;
  string date = 11;
  string sql = 12;
  string text = 13;
  string assigned = 14;
  string delay = 15;
  string real_name = 16;
  string execute_time = 17;
  int32 current_step = 18;
  string osc_info = 19;
  string file = 20;
}

// 单条语句审核记录，与 Yearning engine.Record 对齐。
message Record {
  string sql = 1;
  uint32 affect_rows = 2;
  string status = 3;
  string error = 4;
  uint32 level = 5; // critical=0 error=1 warning=2 info=3 debug=4
  string exec_time = 6;
  string table = 7;
  string schema = 8;
  bool is_osc = 9;
  repeated string insulate_word_list = 10;
  string rollback = 11; // 该语句的回滚语句（执行前抓取前镜像生成，可能为空）
}

message CheckRequest {
  string sql = 1;
  string schema = 2;
  DataSource source = 3;
  string lang = 4;
  AuditRole rule = 5;
  // 审核模式：空 / "write" = 变更命令审核（申请页检测、工单执行前复检），
  // "query" = 只读命令审核（查询页）。
  // 空值按 write 处理，保证旧调用方行为不变；不靠命令名自动推断模式——
  // 申请页里填 find 必须报「不是变更命令」，而不是悄悄按查询规则放行。
  string mode = 6;
}

message CheckReply {
  bool ok = 1;
  string error = 2;
  repeated Record records = 3;
}

message MergeAlterTablesRequest {
  string sqls = 1;
}

message MergeAlterTablesReply {
  bool ok = 1;
  string error = 2;
  string sql = 3;
}

message ExecRequest {
  Order order = 1;
  AuditRole rules = 2;
  DataSource source = 3;
  uint32 max_affect_rows = 4;
}

message ExecReply {
  bool ok = 1;
  string error = 2;
  repeated Record records = 3; // 逐条执行明细（影响行/错误/回滚）。
  repeated string rollback = 4; // 整单回滚语句（binlog 抓取，按事件逆序，每条语句一个元素）
}

message QueryRequest {
  string sql = 1;
  uint64 limit = 2;
  string insulate_word_list = 3;
}

message QueryReply {
  bool ok = 1;
  string error = 2;
  repeated Record records = 3;
}

// 与 Yearning audit.Confirm 对齐，用于 StopDelay 定位待执行的延迟工单。
message Confirm {
  string work_id = 1;
  int32 page = 2;
  int32 flag = 3;
  string text = 4;
  string tp = 5;
  string source_id = 6;
  string delay = 7;
}

message StopDelayRequest {
  Confirm confirm = 1;
}

message StopDelayReply {
  bool ok = 1;
  string error = 2;
  string message = 3;
}
